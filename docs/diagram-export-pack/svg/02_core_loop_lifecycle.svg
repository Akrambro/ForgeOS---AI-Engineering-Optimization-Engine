<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="1400" height="760" fill="#f8fafc"/><text x="70" y="75" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">The ForgeOS core loop</text><text x="70" y="112" font-family="Arial,sans-serif" font-size="18" fill="#475569">Every evaluation becomes evidence for the next decision</text><g font-family="Arial,sans-serif" font-size="19" text-anchor="middle"><g fill="#dbeafe" stroke="#2563eb" stroke-width="3"><rect x="80" y="240" width="210" height="100" rx="12"/><rect x="370" y="240" width="210" height="100" rx="12"/><rect x="660" y="240" width="210" height="100" rx="12"/><rect x="950" y="240" width="210" height="100" rx="12"/></g><text x="185" y="282" fill="#0f172a">1. Define problem</text><text x="185" y="310" font-size="15" fill="#475569">variables · goals · limits</text><text x="475" y="282" fill="#0f172a">2. Propose candidate</text><text x="475" y="310" font-size="15" fill="#475569">seeded algorithm</text><text x="765" y="282" fill="#0f172a">3. Evaluate truth</text><text x="765" y="310" font-size="15" fill="#475569">adapter + diagnostics</text><text x="1055" y="282" fill="#0f172a">4. Persist result</text><text x="1055" y="310" font-size="15" fill="#475569">feasible or explicit failure</text><path d="M290 290h75M580 290h75M870 290h75M1055 340v170H185V350" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#a)"/><rect x="455" y="510" width="490" height="110" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/><text x="700" y="555" fill="#134e4a">5. Select next candidate</text><text x="700" y="585" font-size="16" fill="#134e4a">history, constraints, budget, and evidence</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker></defs></svg>