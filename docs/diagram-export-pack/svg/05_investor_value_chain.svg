<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="1400" height="760" fill="#f8fafc"/><text x="70" y="75" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">ForgeOS stakeholder value chain</text><text x="70" y="112" font-family="Arial,sans-serif" font-size="18" fill="#475569">From expensive evaluation to a defensible engineering decision</text><g font-family="Arial,sans-serif" font-size="20" text-anchor="middle"><g fill="#dbeafe" stroke="#2563eb" stroke-width="3"><rect x="80" y="245" width="220" height="105" rx="12"/><rect x="370" y="245" width="220" height="105" rx="12"/><rect x="660" y="245" width="220" height="105" rx="12"/><rect x="950" y="245" width="220" height="105" rx="12"/></g><text x="190" y="285" fill="#0f172a">High-cost evaluations</text><text x="190" y="315" font-size="16" fill="#334155">simulation · test · experiment</text><text x="480" y="285" fill="#0f172a">ForgeOS loop</text><text x="480" y="315" font-size="16" fill="#334155">select the next candidate</text><text x="770" y="285" fill="#0f172a">Evidence bundle</text><text x="770" y="315" font-size="16" fill="#334155">trials · constraints · seed</text><text x="1060" y="285" fill="#0f172a">Decision confidence</text><text x="1060" y="315" font-size="16" fill="#334155">approval with known limits</text><path d="M300 297h65M590 297h65M880 297h65" stroke="#0f766e" stroke-width="4" marker-end="url(#a)"/><rect x="350" y="510" width="700" height="105" rx="14" fill="#dcfce7" stroke="#166534" stroke-width="3"/><text x="700" y="550" fill="#14532d">Governance + reproducibility</text><text x="700" y="580" font-size="16" fill="#14532d">keeps optimization useful without bypassing engineering judgment</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker></defs></svg>